name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rebuild-apk:
    # This repository holds the *unzipped* contents of a release APK, not a
    # Gradle source project. "Building" therefore means repackaging those
    # artifacts into an aligned, signed, installable APK.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android toolchain
      run: bash .cursor/install.sh

    - name: Rebuild and sign APK
      run: bash scripts/rebuild-apk.sh

    - name: Upload signed APK
      uses: actions/upload-artifact@v4
      with:
        name: app-signed
        path: dist/app-signed.apk
        if-no-files-found: error
